app = "shubh-plan-open"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  SSH_PORT = "2222"
  SERVER_MODE = "true"
  MULTI_USER = "true"
  SHUBH_DATA_DIR = "/app/data"
  SHUBH_OUTPUT_DIR = "/app/output"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "10s"
    method = "GET"
    path = "/"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true

  [[services.ports]]
    port = 2222
