<!-- TAB 5: HONCHO MEMORY & SUB-AGENTS -->
<div id="section-honcho" class="hidden space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-base font-semibold text-amber-400">🧠 Smart Memory & Active Peers</h2>
            <p class="text-xs text-slate-400 mt-0.5">Live memory representations, recorded sessions, and real active cloud peers</p>
        </div>
        <button onclick="document.getElementById('honcho-details-container').dispatchEvent(new Event('refresh-honcho'))" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-semibold flex items-center space-x-1 transition-all">
            <span>🔄 Refresh Memory</span>
        </button>
    </div>

    <!-- HTMX Container for Live Memory Details & Real Active Cloud Peers -->
    <div id="honcho-details-container" hx-get="/api/honcho/details" hx-trigger="load, refresh-honcho from:body">
        <div class="p-4 bg-slate-950/40 border border-slate-800 rounded-xl text-center text-xs text-slate-400">Loading Smart Memory details...</div>
    </div>
</div>
