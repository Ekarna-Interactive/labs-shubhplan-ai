name: shubh-plan-open

services:
  shubh-plan-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shubh-plan-open
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2222:2222"
    environment:
      - PORT=3000
      - SSH_PORT=2222
      - SERVER_MODE=true
      - MULTI_USER=true
      - SHUBH_DATA_DIR=/app/data
      - SHUBH_OUTPUT_DIR=/app/output
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HONCHO_API_KEY=${HONCHO_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
